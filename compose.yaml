services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-processing-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ""
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: OrderProcessingApi/Dockerfile
    container_name: order-processing-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ""
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver

volumes:
  sqlserver_data: